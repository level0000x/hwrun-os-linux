# HWRun OS — FSP 插件描述
# FileSystem Protocol：文件、目录、权限、路径、挂载操作。
# 依赖链 <HAP> <PMP> <LOG> <PARAM> <METAPROTO>
plugin:
  id: "fsp"
  name: "FileSystem Protocol"
  version: "1.0.0"
  type: "fs"

  description: "HWRun OS 文件系统协议：文件、目录、权限、路径、挂载操作"

  provides:
    - protocol: "FSP"
      version: "1.0"

  requires:
    - protocol: "HAP"
      version: "1.0"
    - protocol: "PMP"
      version: "1.0"
    - protocol: "LOG"
      version: "1.0"
    - protocol: "PARAM"
      version: "1.0"
    - protocol: "METAPROTO"
      version: "1.0"

  files:
    - "build/fsp.so"
