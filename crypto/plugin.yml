# HWRun OS — CRYPTO 插件描述
# Cryptographic Protocol（SP 的安全协议子模块）：对称/非对称加密、
# 哈希、HMAC、签名、密钥管理与安全随机数。
plugin:
  id: "crypto"
  name: "Cryptographic Protocol (SP submodule)"
  version: "1.0.0"
  type: "crypto"

  description: "HWRun OS 加密协议，提供对称/非对称加密、哈希、HMAC、签名、密钥管理与安全随机数"

  provides:
    - protocol: "CRYPTO"
      version: "1.0"

  requires:
    - protocol: "SP"
      version: "1.0"
    - protocol: "PARAM"
      version: "1.0"
    - protocol: "LOG"
      version: "1.0"
    - protocol: "METAPROTO"
      version: "1.0"

  conflicts: []

  files:
    - "build/crypto.so"
