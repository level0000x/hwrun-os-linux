# HWRun OS — CONSOLE 插件描述
# System Console Protocol：基于读终端/标准 I/O 的系统控制台抽象。
# 会话管理、banner、逐行/原始 I/O、状态上报、可挂接终端输出。零内核依赖。
plugin:
  id: "console"
  name: "System Console"
  version: "1.0.0"
  type: "tools"

  description: "HWRun OS 系统控制台，提供会话管理、banner、逐行/原始 I/O、状态上报与可挂接终端输出（读终端抽象，零内核依赖）"

  provides:
    - protocol: "CONSOLE"
      version: "1.0"

  requires:
    - protocol: "LOG"
      version: "1.0"
    - protocol: "PARAM"
      version: "1.0"
    - protocol: "METAPROTO"
      version: "1.0"

  conflicts: []

  files:
    - "build/console.so"